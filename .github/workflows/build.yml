steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22.x'
      cache: 'npm'

  - name: Debug: Node & npm versions
    run: |
      node -v
      npm -v
      where.exe node || which node || true
      where.exe npm || which npm || true
    shell: pwsh

  - name: Clear npm cache
    run: npm cache clean --force
    shell: pwsh

  - name: Ensure stable npm
    run: npm install -g npm@9 || npm install -g npm@8 || true
    shell: pwsh

  - name: Dump latest npm debug log (if present)
    run: |
      $logDir = 'C:\npm\cache\_logs'
      if (Test-Path $logDir) {
        $latest = Get-ChildItem -Path $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($latest) { Get-Content $latest.FullName -Raw } else { Write-Host 'No npm debug logs found' }
      } else { Write-Host '$logDir not found' }
    shell: pwsh

  - name: Install dependencies (try npm ci, fallback to npm install)
    run: |
      npm config set loglevel verbose
      $ErrorActionPreference = 'Stop'
      try {
        npm ci --prefer-offline --no-audit --no-fund --unsafe-perm
      } catch {
        Write-Host 'npm ci failed -> falling back to npm install'
        npm install --no-audit --no-fund --unsafe-perm
      }
    shell: pwsh

  - name: Build dist
    run: npm run dist
    shell: pwsh

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: windows-installer
      path: dist/**/*.exe
